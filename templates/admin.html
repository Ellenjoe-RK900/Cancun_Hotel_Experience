{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1>Administración de hoteles</h1><a class="btn btn-primary" href="{{url_for('nuevo')}}">Agregar hotel</a></div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Hotel</th><th>Zona</th><th>Precio</th><th>Unidades</th><th>Acciones</th></tr></thead><tbody>{% for h in hoteles %}<tr><td>{{h.nombre}}</td><td>{{h.zona}}</td><td>{{h.precio|mxn}}</td><td>{{h.habitaciones}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('editar',hotel_id=h._id)}}">Editar</a><form class="d-inline" method="post" action="{{url_for('eliminar',hotel_id=h._id)}}" onsubmit="return confirm('¿Eliminar hotel?')"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
