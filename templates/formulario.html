{% extends 'base.html' %}{% block content %}<h1>{{'Editar hotel' if hotel else 'Nuevo hotel'}}</h1><form method="post" class="card p-4"><label>Nombre</label><input class="form-control mb-3" name="nombre" maxlength="100" value="{{hotel.nombre if hotel else ''}}" required><label>Zona</label><input class="form-control mb-3" name="zona" maxlength="100" value="{{hotel.zona if hotel else ''}}" required><label>Descripción</label><textarea class="form-control mb-3" name="descripcion" maxlength="1500">{{hotel.descripcion if hotel else ''}}</textarea><label>Imagen (URL HTTPS opcional)</label><input class="form-control mb-3" name="imagen" value="{{hotel.imagen if hotel else ''}}"><label>Precio por noche (MXN)</label><input class="form-control mb-3" name="precio" type="number" step="0.01" min="0.01" value="{{hotel.precio if hotel else ''}}" required><label>Habitaciones disponibles</label><input class="form-control mb-3" name="habitaciones" type="number" min="0" value="{{hotel.habitaciones if hotel else 10}}" required><button class="btn btn-primary">Guardar</button></form>{% endblock %}
